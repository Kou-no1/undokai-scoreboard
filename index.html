function defaults(){state={schemaVersion:VERSION,id:uid(),revision:uid(),updatedAt:Date.now(),settings:{title:'運動会',school:'',date:'',raceScored:true,racePoints:[6,5,4,3,2,1],raceTie:'same'},teams:palette.slice(0,5).map(t=>({...t,id:uid()})),events:[],audit:[]};state.events=[makeEvent('徒競走','race'),makeEvent('玉入れ','rank'),makeEvent('リレー','rank')];return state;}
function validateState(d){
 const bad=msg=>{throw new Error(msg)};
 if(!d||typeof d!=='object'||Array.isArray(d)||d.schemaVersion!==VERSION)bad('対応していないデータ形式です。');
 const ident=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,80}$/.test(x);
 const str=(x,n)=>typeof x==='string'&&x.length<=n;
 const point=x=>typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=1000000;
 const s=d.settings;
 if(!ident(d.id)||!ident(d.revision)||!Number.isFinite(d.updatedAt))bad('保存データの識別情報が不正です。');
 if(!s||!str(s.title,100)||!s.title.trim()||!str(s.school,100)||!str(s.date,10)||(s.date&&!/^\d{4}-\d{2}-\d{2}$/.test(s.date))||typeof s.raceScored!=='boolean'||!['same','average'].includes(s.raceTie)||!Array.isArray(s.racePoints)||s.racePoints.length<1||s.racePoints.length>20||!s.racePoints.every(point))bad('運動会の設定が不正です。');
 if(!Array.isArray(d.teams)||d.teams.length<1||d.teams.length>MAX_TEAMS)bad('組数は1〜20組にしてください。');
 const ids=new Set();for(const t of d.teams){if(!t||!ident(t.id)||ids.has(t.id)||!str(t.name,40)||!t.name.trim()||!/^#[0-9a-f]{6}$/i.test(t.color))bad('組の設定が不正です。');ids.add(t.id);}
 if(!Array.isArray(d.events)||d.events.length>100)bad('種目の数が不正です。');
 const eids=new Set();for(const e of d.events){
  if(!e||!ident(e.id)||eids.has(e.id)||!str(e.name,100)||!e.name.trim()||!str(e.grade,40)||!str(e.note,500)||!Object.hasOwn(typeNames,e.type)||typeof e.scored!=='boolean'||!['same','average'].includes(e.tie)||!Array.isArray(e.points)||e.points.length<1||e.points.length>20||!e.points.every(point))bad('種目の設定が不正です。');eids.add(e.id);
  if(!e.winPoints||!['win','draw','loss'].every(k=>point(e.winPoints[k])))bad('勝敗の配点が不正です。');
  if(!e.results||typeof e.results!=='object'||Array.isArray(e.results))bad('種目の得点が不正です。');
  for(const [tid,val]of Object.entries(e.results)){if(!ids.has(tid))bad('存在しない組の得点が含まれています。');if(val===null)continue;if(e.type==='direct'?!point(val):e.type==='rank'?(!Number.isInteger(val)||val<0||val>d.teams.length):e.type==='match'?!['win','draw','loss'].includes(val):true)bad('入力された得点や順位が不正です。');}
  if(!Array.isArray(e.heats)||e.heats.length>100)bad('レース数が不正です。');
  const hids=new Set(),rids=new Set();for(const h of e.heats){if(!h||!ident(h.id)||hids.has(h.id)||!str(h.name,60)||!Array.isArray(h.runners)||h.runners.length<1||h.runners.length>20)bad('レースの設定が不正です。');hids.add(h.id);for(const r of h.runners){if(!r||!ident(r.id)||rids.has(r.id)||(r.teamId!==''&&!ids.has(r.teamId))||(r.place!==null&&(!Number.isInteger(r.place)||r.place<0||r.place>h.runners.length)))bad('徒競走の結果が不正です。');rids.add(r.id);}}
 }
 if(!Array.isArray(d.audit)||d.audit.length>50||d.audit.some(a=>!a||!Number.isFinite(a.time)||!str(a.label,200)))bad('操作履歴が不正です。');return clone(d);
}
let saveError='',bootError='',storageAvailable=true,loadedRevision=null,externalConflict=false;
function init(){
 let seed=null,stored=null;
 try{const raw=JSON.parse($('#embedded-state').textContent);if(raw)seed=validateState(raw);}catch{bootError='HTMLに含まれるデータを読み込めませんでした。初期設定で開始します。';}
 try{const raw=localStorage.getItem(STORAGE);if(raw){stored=validateState(JSON.parse(raw));loadedRevision=stored.revision;}}catch{storageAvailable=false;bootError='自動保存データを読み込めませんでした。保存・出力からバックアップしてください。';}
 const useSeed=seed&&(!stored||seed.id!==stored.id||seed.updatedAt>stored.updatedAt);
 state=useSeed?seed:stored||seed||defaults();
 if(useSeed&&stored)loadedRevision=stored.revision;
 if(!stored||useSeed)persist();
}
function included(e){return e.scored&&(e.type!=='race'||state.settings.raceScored);}
function rankValues(entries,points,tie,partial=false){
 const places=entries.map(r=>r.place).filter(p=>p!==null&&p>0),counts=new Map();for(const p of places)counts.set(p,(counts.get(p)||0)+1);
 let expected=1;for(const p of [...counts.keys()].sort((a,b)=>a-b)){if(p<expected||(!partial&&p!==expected))return{error:'着順は1位から入力してください。同着の次は人数分の順位を空けます（例：1位・1位・3位）。'};expected=p+counts.get(p);}
 const values={};for(const r of entries){let v=0;if(r.place>0){const n=counts.get(r.place)||1;if(r.place+n-1>points.length)return{error:r.place+'位以降の配点が不足しています。種目設定で配点を追加してください。'};v=tie==='average'?points.slice(r.place-1,r.place-1+n).reduce((a,b)=>a+b,0)/n:points[r.place-1];}values[r.id]=v;}return{values,error:''};
}
function heatScore(e,h){
 const entries=h.runners.filter(r=>r.teamId&&r.place!==null),entered=entries.length;
 const res=rankValues(entries,e.points,e.tie,entered<h.runners.length);
 const totals=Object.fromEntries(state.teams.map(t=>[t.id,0]));
 if(!res.error)for(const r of entries)totals[r.teamId]+=res.values[r.id];
 return{complete:entered===h.runners.length&&!res.error,entered,values:res.values||{},totals,hasCounted:entered>0&&!res.error,error:res.error||''};
}
function eventScore(e){
 const totals=Object.fromEntries(state.teams.map(t=>[t.id,0]));let entered=0,required=state.teams.length,complete=false,error='',unitsDone=0,countedRows=0;
 if(e.type==='race'){
  required=e.heats.reduce((a,h)=>a+h.runners.length,0);for(const h of e.heats){const hs=heatScore(e,h);entered+=hs.entered;if(hs.error)error=hs.error;if(hs.complete)unitsDone++;if(hs.hasCounted){countedRows++;for(const t of state.teams)totals[t.id]+=hs.totals[t.id];}}complete=e.heats.length>0&&unitsDone===e.heats.length;
 }else{
  entered=state.teams.filter(t=>e.results[t.id]!==null&&e.results[t.id]!==undefined).length;
  if(e.type==='rank'){if(entered===required){const res=rankValues(state.teams.map(t=>({id:t.id,place:e.results[t.id]})),e.points,e.tie);error=res.error;complete=!error;if(complete)for(const t of state.teams)totals[t.id]=res.values[t.id];}}
  else{for(const t of state.teams){const v=e.results[t.id];if(v!==null&&v!==undefined)totals[t.id]=e.type==='match'?e.winPoints[v]:v;}complete=entered===required;}
 }
 const hasCounted=e.type==='race'?countedRows>0:e.type==='rank'?complete:entered>0;
 return{totals,entered,required,complete,error,unitsDone,hasCounted,status:error?'error':complete?'complete':entered?'partial':'empty'};
}
function summary(){const totals=Object.fromEntries(state.teams.map(t=>[t.id,0])),reports=new Map();let scored=0,complete=0,partial=0;for(const e of state.events){const report=eventScore(e);reports.set(e.id,report);if(included(e)){scored++;if(report.complete)complete++;else if(report.entered)partial++;for(const t of state.teams)totals[t.id]+=report.totals[t.id];}}for(const k of Object.keys(totals))totals[k]=round(totals[k]);const sorted=[...state.teams].sort((a,b)=>totals[b.id]-totals[a.id]);const ranks=Object.fromEntries(sorted.map(t=>[t.id,1+sorted.filter(other=>totals[other.id]>totals[t.id]).length]));return{totals,reports,scored,complete,partial,sorted,ranks,hasScores:[...reports.entries()].some(([id,r])=>included(state.events.find(e=>e.id===id))&&r.hasCounted)};}
function statusChip(e,r=eventScore(e)){if(!included(e))return'<span class="chip out">得点対象外</span>';return r.error?'<span class="chip bad">要確認</span>':r.complete?'<span class="chip good">'+icon('check')+'入力済み</span>':r.entered?'<span class="chip warn">入力途中</span>':'<span class="chip">未入力</span>';}

function persist(){
 if(externalConflict)return false;

}

function perform(label,fn,{renderAll=true,merge=''}={}){
 if(externalConflict){notify('別の画面の更新を読み込んでから操作してください。',true);return false;}
 const before=clone(state);try{fn();}catch(err){state=before;notify(err.message,true);return false;}
 if(JSON.stringify(before)===JSON.stringify(state))return false;
 const now=Date.now(),merged=merge&&lastMerge===merge&&now-lastMergeTime<2500;
 if(!merged){history.push({data:before,label});if(history.length>40)history.shift();state.audit.unshift({time:now,label});state.audit=state.audit.slice(0,40);}

function finishCell(h,place){
 const entries=h.runners.filter(r=>r.teamId&&r.place===place),zero=h.runners.filter(r=>r.place===0).length;
 const counts=new Map();for(const r of h.runners)if(r.teamId&&r.place>0)counts.set(r.place,(counts.get(r.place)||0)+1);
 const covered=[...counts].some(([p,n])=>p<place&&place<p+n);
 const disabled=!entries.length&&(place>h.runners.length-zero||covered);
 return{entries,disabled,reason:place>h.runners.length?'—':covered?'同着':zero&&place>h.runners.length-zero?'棄権':'—'};
}

function setFinishCell(h,place,teamId){
 if(!Number.isInteger(place)||place<1||place>h.runners.length)throw new Error('この着順には入力できません。');
 if(teamId&&!state.teams.some(t=>t.id===teamId))throw new Error('組を選択してください。');
 const existing=h.runners.filter(r=>r.place===place);
 if(!teamId){for(const r of existing){r.teamId='';r.place=null;}return;}
 if(finishCell(h,place).disabled)throw new Error('同着・棄権のため、この着順は使いません。「詳細」で確認してください。');
 const runner=existing[0]||h.runners.find(r=>r.place===null||!r.teamId);if(!runner)throw new Error('空いている出走者がいません。「詳細」で確認してください。');
 runner.teamId=teamId;runner.place=place;for(const r of existing.slice(1)){r.teamId='';r.place=null;}
}
function resizeHeat(e,h,count){

}

y></table></div><div class="legend"><span>—：集計できる結果が未入力</span><span>0：入力済みの0点</span><span>対象外：合計に加算しない種目</span></div></section></div>';}
function renderSettings(){return'<div class="stack settings-page"><section class="panel"><div class="panel-head"><div><h2>運動会の基本設定</h2><p>変更すると自動で保存されます。</p></div><span class="chip good">設定は翌年度も利用可能</span></div><div class="panel-body form-grid"><div class="field"><label for="title-input">運動会の名前</label><input id="title-input" data-field="setting" data-key="title" value="'+esc(state.settings.title)+'" maxlength="100"></div><div class="field"><label for="school-input">学校名・会場名</label><input id="school-input" data-field="setting" data-key="school" value="'+esc(state.settings.school)+'" maxlength="100" placeholder="例：〇〇小学校"></div><div class="field"><label for="date-input">開催日</label><input id="date-input" type="date" data-field="setting" data-key="date" value="'+esc(state.settings.date)+'"></div></div></section><section class="panel"><div class="panel-head"><div><h2>組の編成</h2><p>組数・名前・色を自由に設定できます（1〜20組）。</p></div><span class="chip">'+state.teams.length+'組</span></div><div class="panel-body"><div class="preset-row"><span>よく使う編成</span>'+button('team-preset','2組：赤・白','small','data-count="2"')+button('team-preset','3組：赤・黄・青','small','data-count="3"')+button('team-preset','5組','small','data-count="5"')+'</div><div class="settings-teams">'+state.teams.map((t,i)=>'<div class="team-settings-row"><span class="index">'+String(i+1).padStart(2,'0')+'</span><input type="color" data-field="team-color" data-team="'+t.id+'" value="'+t.color+'" aria-label="'+esc(t.name)+'の色"><input data-field="team-name" data-team="'+t.id+'" value="'+esc(t.name)+'" maxlength="40" aria-label="'+(i+1)+'組目の名前">'+button('remove-team',icon('trash'),'icon-only danger','data-team="'+t.id+'" aria-label="'+esc(t.name)+'を削除" '+(state.teams.length===1?'disabled':''))+'</div>').join('')+button('add-team','組を追加','soft',(state.teams.length>=MAX_TEAMS?'disabled':''),'plus')+'</div><p class="muted" style="font-size:11px;margin-top:15px">組を追加すると、順位種目は新しい組の入力が必要になります。出走人数は組数と別に設定できます。</p></div></section><section class="panel"><div class="panel-head"><div><h2>徒競走の得点設定</h2><p>得点対象の切り替えと、標準の配点を設定します。</p></div></div><div class="panel-body"><div class="check-box"><label class="check-label"><input type="checkbox" data-field="race-scored" '+(state.settings.raceScored?'checked':'')+'>徒競走を合計得点に含める</label></div><div class="section-head" style="margin-top:21px"><div><h3>標準の着順別配点</h3><p>新しく追加する徒競走に使用します。</p></div><div class="action-row">'+button('remove-race-point','順位を減らす','small',state.settings.racePoints.length===1?'disabled':'')+button('add-race-point','順位を追加','small',state.settings.racePoints.length>=20?'disabled':'')+'</div></div><div class="point-inputs">'+state.settings.racePoints.map((p,i)=>'<div class="field"><label for="race-point-'+i+'">'+(i+1)+'位</label><input id="race-point-'+i+'" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" data-field="race-point" data-index="'+i+'" value="'+p+'"></div>').join('')+'</div><div class="form-grid" style="margin-top:18px"><div class="field"><label for="race-tie">同着時の得点</label><select id="race-tie" data-field="race-tie"><option value="same" '+(state.settings.raceTie==='same'?'selected':'')+'>同順位に同じ点数を付与</option><option value="average" '+(state.settings.raceTie==='average'?'selected':'')+'>同着が占める順位の点数を平均</option></select></div></div><div class="action-row" style="margin-top:18px">'+button('apply-race-points','登録済みの徒競走にも適用','soft')+'<span class="muted" style="font-size:11px">入力済みの結果も再計算します。</span></div></div></section><section class="panel"><div class="panel-head"><div><h2>種目と配点</h2><p>プログラム順に並び替えできます。配点変更は入力済みの結果にも反映されます。</p></div>'+button('new-event','種目を追加','primary small','','plus')+'</div><div class="panel-body">'+(state.events.length?state.events.map((e,i)=>'<div class="settings-event"><span class="program-no">'+String(i+1).padStart(2,'0')+'</span><div class="details"><strong>'+esc(e.name)+'</strong><small>'+(e.grade?esc(e.grade)+' / ':'')+typeNames[e.type]+'方式 / '+(included(e)?'得点対象':'得点対象外')+'</small></div><div class="action-row">'+button('move-event',icon('up'),'icon-only','data-id="'+e.id+'" data-direction="-1" aria-label="種目を上へ移動" '+(i===0?'disabled':''))+button('move-event',icon('down'),'icon-only','data-id="'+e.id+'" data-direction="1" aria-label="種目を下へ移動" '+(i===state.events.length-1?'disabled':''))+button('edit-event','設定','small','data-id="'+e.id+'"')+button('remove-event',icon('trash'),'icon-only danger','data-id="'+e.id+'" aria-label="'+esc(e.name)+'を削除"')+'</div></div>').join(''):'<p class="muted">種目がありません。「種目を追加」から登録してください。</p>')+'</div></section></div>';}
function renderData(){return'<div class="stack data-page"><div class="section-head" style="margin-bottom:0"><div><h2>保存と出力</h2><p>設定も途中の得点も、いつでも持ち出せます。</p></div></div><div class="data-grid"><section class="panel data-card"><div class="data-icon">'+icon('download')+'</div><h3>バックアップ</h3><p>設定・種目・入力結果をまとめてJSONファイルに保存します。作業の区切りや終了時におすすめです。</p><div class="action-row">'+button('backup','バックアップを保存','primary','','download')+button('export-settings','設定だけ保存','small')+'</div></section><section class="panel data-card"><div class="data-icon">'+icon('upload')+'</div><h3>データを読み込む</h3><p>保存したバックアップや設定を復元します。現在の内容と入れ替わるので、必要なら先にバックアップしてください。</p>'+button('import','JSONを読み込む','','','upload')+'</section><section class="panel data-card"><div class="data-icon">'+icon('file')+'</div><h3>1枚HTMLで持ち出す</h3><p>今の設定・得点を含むHTMLを保存できます。ファイルをブラウザで開けば、インターネットなしでも使用できます。</p>'+button('html','HTMLファイルを保存','','','download')+'</section><section class="panel data-card"><div class="data-icon">'+icon('printer')+'</div><h3>記録用に出力する</h3><p>種目別の得点と合計を印刷、またはCSVで出力します。CSVはExcelやスプレッドシートで開けます。</p><div class="action-row">'+button('print','集計表を印刷','','','printer')+button('csv','CSVを保存','','','download')+'</div></section></div><section class="panel"><div class="panel-body"><details class="help-details"><summary>使い方と保存について<span>'+icon('down')+'</span></summary><p>①「設定」で組編成と配点を決める → ②「得点入力」で結果を入力する → ③「集計表」で合計と未入力を確認する、の順に使います。<br>入力はこの端末・このブラウザに自動保存されます。別端末との自動共有はありません。複数の端末で入力する場合は、集計担当の1台へ結果をまとめてください。<br>ブラウザのデータを消すと自動保存内容も消えます。JSONバックアップを残してください。HTMLファイルを移動・改名すると保存の扱いが変わる場合があるため、バックアップの読み込みで引き継げます。<br>徒競走は各着順の列に組を入力し、Tabキーで次の着順・次のレースへ移動できます。入力したセルから暫定得点に反映します。同着・棄権は各行の「詳細」で設定してください。順位方式は、全組の順位がそろってから集計します。点数・勝敗方式は入力した組から加算します。<br>配点は0以上、小数第2位まで入力できます。同点の組には同じ総合順位を表示します。順位は比較できる結果が入力された後に表示します。</p></details></div></section><section class="panel"><div class="panel-head"><div><h3>最近の操作</h3><p>「取り消し」はこの画面を開いてからの操作に使えます。</p></div></div><div class="panel-body">'+(state.audit.length?state.audit.slice(0,12).map(a=>'<div class="audit-row"><time>'+esc(new Date(a.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}))+'</time><span>'+esc(a.label)+'</span></div>').join(''):'<p class="muted" style="font-size:12px">操作履歴はまだありません。</p>')+'</div></section><section class="panel"><div class="panel-head"><div><h3>翌年度の準備</h3><p>組編成・種目・配点を残して、入力結果だけ消します。</p></div>'+button('reset-scores','得点をすべて消す','danger small','','trash')+'</div></section></div>';}
function ensurePoints(e,n){while(e.points.length<n)e.points.push(Math.max(0,(e.points.at(-1)||0)-1));}
function dialogRender(){const e=eventDraft;$('#event-dialog').innerHTML='<form id="event-form"><div class="dialog-head"><h2 id="dialog-title">'+(e._new?'種目を追加':'種目と配点の設定')+'</h2><button type="button" class="btn icon-only" data-action="close-dialog" aria-label="閉じる">'+icon('close')+'</button></div><div class="dialog-body"><div class="form-grid"><div class="field wide"><label for="event-name">種目名</label><input id="event-name" name="name" required maxlength="100" value="'+esc(e.name)+'" placeholder="例：3・4年 玉入れ"></div><div class="field"><label for="event-grade">対象学年・区分</label><input id="event-grade" name="grade" maxlength="40" value="'+esc(e.grade)+'" placeholder="例：3・4年 / 全校"></div><div class="field"><label for="event-type">入力方式</label><select id="event-type" name="type" '+(!e._new?'disabled':'')+'>'+Object.keys(typeNames).map(k=>'<option value="'+k+'" '+(e.type===k?'selected':'')+'>'+({race:'徒競走：レースごとの着順',rank:'順位：組の順位',match:'勝敗：組ごとの勝敗',direct:'点数：直接入力'}[k])+'</option>').join('')+'</select></div><div class="field wide check-box"><label class="check-label"><input type="checkbox" name="scored" '+(e.scored?'checked':'')+'>この種目を得点対象にする</label>'+(e.type==='race'&&!state.settings.raceScored?'<small>徒競走全体の得点設定は現在OFFです。「設定」でONにすると加算されます。</small>':'')+'</div></div><div id="dialog-points" style="margin-top:19px">'+(['race','rank'].includes(e.type)?'<h3 style="margin-bottom:12px">着順別の配点</h3><div class="point-inputs">'+e.points.map((p,i)=>'<div class="field"><label for="event-point-'+i+'">'+(i+1)+'位</label><input id="event-point-'+i+'" name="point-'+i+'" type="number" min="0" max="1000000" step="0.01" value="'+p+'" required></div>').join('')+'</div><div class="field" style="margin-top:16px"><label for="event-tie">同着時の得点</label><select id="event-tie" name="tie"><option value="same" '+(e.tie==='same'?'selected':'')+'>同順位に同じ点数を付与</option><option value="average" '+(e.tie==='average'?'selected':'')+'>同着が占める順位の点数を平均</option></select><small>例：1位10点・2位6点で2人が同着1位なら、「同じ点数」は各10点、「平均」は各8点。</small></div>':e.type==='match'?'<div class="point-inputs">'+['win','draw','loss'].map((k,i)=>'<div class="field"><label for="event-win-'+k+'">'+['勝ち','引き分け','負け'][i]+'</label><input id="event-win-'+k+'" name="win-'+k+'" type="number" min="0" max="1000000" step="0.01" value="'+e.winPoints[k]+'" required></div>').join('')+'</div>':'<div class="notice info">'+icon('file')+'各組の得点をそのまま合計に加算します。</div>')+'</div><div class="field" style="margin-top:17px"><label for="event-note">メモ（任意）</label><textarea id="event-note" name="note" rows="2" maxlength="500" placeholder="例：各学年の得点を合計して入力">'+esc(e.note)+'</textarea></div>'+(!e._new?'<p class="muted" style="font-size:11px;margin-top:14px">配点を変えると、入力済みの結果も自動で再計算されます。</p>':'')+'<div class="dialog-error" id="dialog-error" role="alert"></div></div><div class="dialog-foot"><button type="button" class="btn" data-action="close-dialog">キャンセル</button><button type="submit" class="btn primary">'+(e._new?'種目を追加':'設定を保存')+'</button></div></form>';}
function openEvent(id){const found=state.events.find(e=>e.id===id);eventDraft=found?clone(found):{...makeEvent('','rank'),_new:true};if(eventDraft.type==='rank')ensurePoints(eventDraft,state.teams.length);if(eventDraft.type==='race')ensurePoints(eventDraft,Math.max(...eventDraft.heats.map(h=>h.runners.length),1));dialogRender();$('#event-dialog').showModal();}
function clearResults(d){for(const e of d.events){e.results={};for(const h of e.heats)for(const r of h.runners)r.place=null;}return d;}
function anyResults(){return state.events.some(e=>Object.values(e.results).some(v=>v!==null)||e.heats.some(h=>h.runners.some(r=>r.place!==null)));}
function numberValue(el,allowEmpty=false){if(el.value===''){if(allowEmpty)return null;throw new Error('配点を入力してください。0点も設定できます。');}const v=Number(el.value);if(!Number.isFinite(v)||v<0||v>1000000||Math.abs(v*100-Math.round(v*100))>0.0001)throw new Error('点数は0〜1,000,000の範囲で、小数第2位まで入力してください。');return v;}
function getEvent(id){return state.events.find(e=>e.id===id);}
function inputHandler(el,live=false){
 const f=el.dataset.field;if(!f)return;const e=getEvent(el.dataset.id),merge=[f,el.dataset.key,el.dataset.team,el.dataset.index,e?.id,el.dataset.heat,el.dataset.runner].join(':');let label='',fn;
 if(f==='race-cell'){
  if(el.value==='__tie__')return;const h=e.heats.find(h=>h.id===el.dataset.heat),place=Number(el.dataset.place),teamId=el.value;
  perform(e.name+'：第'+(e.heats.indexOf(h)+1)+'レース '+place+'位を入力',()=>setFinishCell(h,place,teamId),{renderAll:false});refreshRaceSheet(getEvent(e.id),h.id);return;
 }
 if(f==='heat-size'){
  const h=e.heats.find(h=>h.id===el.dataset.heat),n=Number(el.value);if(!Number.isInteger(n)||n<1||n>20){notify('出走人数は1〜20人で設定してください。',true);render();return;}
  if(n<h.runners.length&&h.runners.some(r=>r.teamId||r.place!==null)&&!confirm('出走人数を'+n+'人に減らしますか？人数を超える入力結果は削除されます。')){el.value=String(h.runners.length);return;}
  perform(e.name+'の出走人数を'+n+'人に変更',()=>resizeHeat(e,h,n));return;
 }
 if(f==='setting'){const k=el.dataset.key;if(k==='title'&&!el.value.trim()){if(!live){notify('運動会の名前を入力してください。',true);render();}return;}label='運動会の基本設定を変更';fn=()=>state.settings[k]=el.value;}
 if(f==='team-name'){if(!el.value.trim()){if(!live){notify('組の名前を入力してください。',true);render();}return;}label='組の名前を変更';fn=()=>state.teams.find(t=>t.id===el.dataset.team).name=el.value;}
 if(f==='team-color'){label='組の色を変更';fn=()=>state.teams.find(t=>t.id===el.dataset.team).color=el.value;}
 if(f==='race-scored'){label='徒競走の得点対象を変更';fn=()=>state.settings.raceScored=el.checked;}
 if(f==='race-point'){let v;try{v=numberValue(el);}catch(err){if(!live){notify(err.message,true);render();}return;}label='徒競走の標準配点を変更';fn=()=>state.settings.racePoints[Number(el.dataset.index)]=v;}
 if(f==='race-tie'){label='徒競走の同着ルールを変更';fn=()=>state.settings.raceTie=el.value;}
 if(f==='event-result'){let v;if(e.type==='direct'){try{v=numberValue(el,true);}catch(err){if(!live){notify(err.message,true);render();}return;}}else v=el.value===''?null:e.type==='rank'?Number(el.value):el.value;label=e.name+'：'+state.teams.find(t=>t.id===el.dataset.team).name+'の結果を入力';fn=()=>e.results[el.dataset.team]=v;}
 if(f==='runner-team'||f==='runner-place'){const h=e.heats.find(h=>h.id===el.dataset.heat),r=h.runners.find(r=>r.id===el.dataset.runner);label=e.name+'：第'+(e.heats.indexOf(h)+1)+'レースを入力';fn=()=>f==='runner-team'?r.teamId=el.value:r.place=el.value===''?null:Number(el.value);}
 if(fn){const ok=perform(label,fn,{renderAll:!live,merge});if(!live&&!ok)render();}
}
function download(text,name,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function datedName(suffix){return'sportsday-'+(state.settings.date||new Date().toLocaleDateString('sv-SE'))+suffix;}
function exportJSON(settingsOnly=false){const d=clone(state);if(settingsOnly){clearResults(d);for(const e of d.events)for(const h of e.heats)for(const r of h.runners)r.teamId='';d.audit=[];}download(JSON.stringify({app:'sports-day-scoreboard',kind:settingsOnly?'settings':'backup',schemaVersion:VERSION,exportedAt:new Date().toISOString(),data:d},null,2),datedName(settingsOnly?'-settings.json':'-backup.json'),'application/json;charset=utf-8');notify(settingsOnly?'設定ファイルを保存しました。':'バックアップを保存しました。');}
function exportHTML(){const root=document.documentElement.cloneNode(true);root.querySelector('#embedded-state').textContent=JSON.stringify(state).replaceAll('<','\\u003c').replaceAll('&','\\u0026').replaceAll('\u2028','\\u2028').replaceAll('\u2029','\\u2029');root.querySelector('body').classList.remove('presentation');root.querySelector('#event-dialog').removeAttribute('open');root.querySelector('#event-dialog').innerHTML='';root.querySelector('#heat-dialog').removeAttribute('open');root.querySelector('#heat-dialog').innerHTML='';root.querySelector('#help-dialog').removeAttribute('open');root.querySelector('#help-dialog').innerHTML='';root.querySelector('#toast').className='toast';download('<!doctype html>\n'+root.outerHTML,'sports-day-scoreboard.html','text/html;charset=utf-8');notify('今の設定・得点を含むHTMLを保存しました。');}
function csvCell(v){let str=String(v??'');if(/^[=+@\-\t\r\n]/.test(str))str="'"+str;return'"'+str.replaceAll('"','""')+'"';}
function exportCSV(){const s=summary(),rows=[['種目','対象学年','入力状況',...state.teams.map(t=>t.name)],...state.events.map(e=>{const r=s.reports.get(e.id);return[e.name,e.grade,!included(e)?'得点対象外':r.error?'要確認':r.complete?'入力済み':r.entered?'入力途中':'未入力',...state.teams.map(t=>!included(e)?'対象外':!r.hasCounted?'':s.reports.get(e.id).totals[t.id]===0?0:round(r.totals[t.id]))];}),['合計得点','',s.scored&&s.complete===s.scored?'入力済み':'暫定',...state.teams.map(t=>s.totals[t.id])],['総合順位','','',...state.teams.map(t=>s.hasScores?s.ranks[t.id]:'')]];download('\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),datedName('-scores.csv'),'text/csv;charset=utf-8');notify('CSVを保存しました。');}
function renderPresentation(){const s=summary();$('#presentation').innerHTML='<div class="present-head"><div class="present-title"><div class="eyebrow">SPORTS DAY SCOREBOARD</div><h1>'+esc(state.settings.title)+'</h1><p class="muted">'+esc(state.settings.school)+'</p></div><div class="action-row"><button class="help-trigger" data-action="help" title="使い方ガイド" aria-label="使い方ガイドを開く" aria-haspopup="dialog">?</button>'+button('fullscreen','全画面','small','','expand')+button('exit-presentation','入力へ戻る','small','','close')+'</div></div><div class="present-grid">'+state.teams.map(t=>'<article class="present-card" style="--team:'+t.color+'"><div class="team-name"><span class="team-dot"></span>'+esc(t.name)+'</div><div class="score-num">'+fmt(s.totals[t.id])+'<small>点</small></div><div class="rank-badge">'+(s.hasScores?s.ranks[t.id]+'位':'集計待ち')+'</div></article>').join('')+'</div><div class="present-footer"><span>'+esc(dateText())+'</span><span>'+s.complete+' / '+s.scored+'得点種目 入力済み'+(s.scored&&s.complete===s.scored?'':' / 暫定得点')+'</span></div>';}
document.addEventListener('click',async event=>{
 const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,e=getEvent(b.dataset.id);
 if(a==='help'){openHelp();return;}
 if(a==='help-close'||a==='help-finish'){closeHelp();return;}
 if(a==='help-next'){moveHelp(helpStep+1);return;}
 if(a==='help-back'){moveHelp(helpStep-1,'help-back');return;}
 if(a==='help-step'){moveHelp(Number(b.dataset.step));return;}
 if(a==='help-go'){goFromHelp();return;}
 if(a==='nav'){view=b.dataset.view;render();return;}
 if(a==='select-event'){selectedEvent=b.dataset.id;view='entry';render();return;}
 if(a==='close-dialog'){$('#event-dialog').close();return;}
 if(a==='close-heat-dialog'){$('#heat-dialog').close();return;}
 if(a==='heat-details'){openHeat(e,e.heats.find(h=>h.id===b.dataset.heat));return;}
 if(a==='set-heat-count'){
  const n=Number($('#race-row-count').value);if(!Number.isInteger(n)||n<1||n>100){notify('レース数は1〜100で設定してください。',true);return;}
  if(n<e.heats.length&&e.heats.slice(n).some(h=>h.runners.some(r=>r.teamId||r.place!==null))&&!confirm('レース数を'+n+'に減らしますか？第'+(n+1)+'レース以降の入力結果は削除されます。'))return;
  perform(e.name+'を'+n+'レースに変更',()=>{const count=e.heats.at(-1)?.runners.length||6;e.heats=e.heats.slice(0,n);while(e.heats.length<n)e.heats.push(makeHeat(count));ensurePoints(e,count);});return;
 }
 if(a==='new-event'||a==='edit-event'){if(state.events.length>=100&&a==='new-event'){notify('種目は100件まで登録できます。',true);return;}openEvent(b.dataset.id);return;}
 if(a==='presentation'){presenting=true;document.body.classList.add('presentation');renderPresentation();return;}
 if(a==='exit-presentation'){presenting=false;document.body.classList.remove('presentation');if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});return;}
 if(a==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('このブラウザは全画面表示に対応していません。');}catch{notify('全画面表示を開始できませんでした。',true);}return;}
 if(a==='undo'){if(!history.length)return;if(externalConflict){notify('最新のデータを読み込んでください。',true);return;}const before=clone(state),entry=history.pop();state=clone(entry.data);state.audit.unshift({time:Date.now(),label:'取り消し：'+entry.label});state.audit=state.audit.slice(0,40);state.updatedAt=Date.now();state.revision=uid();lastMerge='';if(!persist()&&externalConflict){state=before;history.push(entry);}render();notify('直前の操作を取り消しました。');return;}
 if(a==='backup'){exportJSON();return;}if(a==='export-settings'){exportJSON(true);return;}if(a==='html'){exportHTML();return;}if(a==='csv'){exportCSV();return;}if(a==='import'){$('#import-file').value='';$('#import-file').click();return;}
 if(a==='print'){printPrevious=view;view='results';render();window.print();return;}
 if(a==='reload-external'){try{const latest=validateState(JSON.parse(localStorage.getItem(STORAGE)));state=latest;loadedRevision=latest.revision;externalConflict=false;saveError='';history=[];render();notify('最新のデータを読み込みました。');}catch{notify('最新のデータを読み込めませんでした。先にバックアップしてください。',true);}return;}
 if(a==='add-team'){if(state.teams.length>=MAX_TEAMS)return;perform('組を追加',()=>{const p=palette[state.teams.length%palette.length];state.teams.push({id:uid(),name:state.teams.some(t=>t.name===p.name)?'第'+(state.teams.length+1)+'組':p.name,color:p.color});for(const ev of state.events)if(ev.type==='rank')ensurePoints(ev,state.teams.length);});return;}
 if(a==='remove-team'){if(state.teams.length===1)return;const t=state.teams.find(t=>t.id===b.dataset.team);if(!confirm(t.name+'を削除しますか？この組の得点と出走者の所属組は消えます。順位方式の種目は全組の順位が未入力に戻ります。'))return;perform(t.name+'を削除',()=>{state.teams=state.teams.filter(t=>t.id!==b.dataset.team);for(const ev of state.events){delete ev.results[b.dataset.team];if(ev.type==='rank')ev.results={};for(const h of ev.heats)for(const r of h.runners)if(r.teamId===b.dataset.team)r.teamId='';}});return;}
 if(a==='team-preset'){if(!confirm(b.dataset.count+'組の編成に変更しますか？組の設定と入力結果を入れ替えます。種目と配点は残ります。'))return;perform('組編成を'+b.dataset.count+'組に変更',()=>{const n=Number(b.dataset.count),p=n===3?[palette[0],palette[2],palette[3]]:palette.slice(0,n);state.teams=p.map(t=>({...t,id:uid()}));clearResults(state);for(const ev of state.events){if(ev.type==='rank')ensurePoints(ev,n);for(const h of ev.heats)for(const r of h.runners)r.teamId='';}});return;}
 if(a==='add-race-point'){if(state.settings.racePoints.length<20)perform('徒競走の標準配点に順位を追加',()=>state.settings.racePoints.push(Math.max(0,state.settings.racePoints.at(-1)-1)));return;}
 if(a==='remove-race-point'){if(state.settings.racePoints.length>1)perform('徒競走の標準配点の順位を削除',()=>state.settings.racePoints.pop());return;}
 if(a==='apply-race-points'){if(!confirm('登録済みのすべての徒競走に、標準の配点と同着ルールを適用しますか？入力済みの得点も再計算されます。'))return;perform('すべての徒競走に標準配点を適用',()=>{for(const ev of state.events)if(ev.type==='race'){ev.points=clone(state.settings.racePoints);ensurePoints(ev,Math.max(...ev.heats.map(h=>h.runners.length),1));ev.tie=state.settings.raceTie;}});return;}
 if(a==='move-event'){const i=state.events.indexOf(e),j=i+Number(b.dataset.direction);if(j>=0&&j<state.events.length)perform('種目の順序を変更',()=>[state.events[i],state.events[j]]=[state.events[j],state.events[i]]);return;}
 if(a==='remove-event'){if(!confirm(e.name+'を削除しますか？この種目の入力結果も削除します。'))return;perform(e.name+'を削除',()=>state.events=state.events.filter(ev=>ev.id!==e.id));return;}
 if(a==='clear-event'){if(!confirm(e.name+'の入力結果を消しますか？レースの所属組、種目設定と配点は残ります。'))return;perform(e.name+'の入力結果を消去',()=>{e.results={};for(const h of e.heats)for(const r of h.runners)r.place=null;});return;}
 if(a==='reset-scores'){if(!confirm('すべての種目の入力結果を消しますか？組編成・種目・配点・レースの所属組は残ります。'))return;perform('すべての得点を消去',()=>clearResults(state));return;}
 if(a==='add-heat'){if(e.heats.length>=100)return;perform(e.name+'にレースを追加',()=>{const n=e.heats.at(-1)?.runners.length||6;e.heats.push(makeHeat(n));ensurePoints(e,n);});return;}
 if(a==='remove-heat'){const h=e.heats.find(h=>h.id===b.dataset.heat);if(!confirm('第'+(e.heats.indexOf(h)+1)+'レースを削除しますか？入力結果も削除します。'))return;const ok=perform(e.name+'のレースを削除',()=>e.heats=e.heats.filter(h=>h.id!==b.dataset.heat));if(ok)$('#heat-dialog').close();return;}
 if(a==='add-runner'){const h=e.heats.find(h=>h.id===b.dataset.heat);if(h.runners.length>=20)return;perform(e.name+'の出走者を追加',()=>{h.runners.push({id:uid(),teamId:'',place:null});ensurePoints(e,h.runners.length);});return;}
 if(a==='remove-runner'){const h=e.heats.find(h=>h.id===b.dataset.heat),r=h.runners.find(r=>r.id===b.dataset.runner);if(h.runners.length===1)return;if((r.teamId||h.runners.some(r=>r.place!==null))&&!confirm('このレーンを削除しますか？このレースの着順はすべて未入力に戻ります。'))return;perform(e.name+'の出走者を削除',()=>{h.runners=h.runners.filter(r=>r.id!==b.dataset.runner);for(const r of h.runners)r.place=null;});return;}
});
document.addEventListener('input',event=>{const el=event.target;if(el.matches('input[data-field]:not([type=checkbox]):not([type=color]):not([type=date])'))inputHandler(el,true);});
document.addEventListener('change',event=>{
 const el=event.target;if(el.id==='event-type'){
  const form=$('#event-form'),name=form.elements.name.value,grade=form.elements.grade.value,note=form.elements.note.value,scored=form.elements.scored.checked;eventDraft={...makeEvent(name,el.value,grade),note,scored,_new:true};dialogRender();return;
 }
 if(el.dataset.field)inputHandler(el,false);
});
document.addEventListener('submit',event=>{
 if(event.target.id==='heat-form'){
  event.preventDefault();const form=event.target,e=getEvent(heatDraft.eventId),h=clone(heatDraft.heat);
  try{h.name=form.elements.heatName.value.trim();for(let i=0;i<h.runners.length;i++){h.runners[i].teamId=form.elements['team-'+i].value;const v=form.elements['place-'+i].value;h.runners[i].place=v===''?null:Number(v);if(!h.runners[i].teamId&&h.runners[i].place!==null)throw new Error('着順を入力した出走者の所属組も選択してください。');}const hs=heatScore(e,h);if(hs.error)throw new Error(hs.error);const ok=perform(e.name+'のレース詳細を変更',()=>e.heats[e.heats.findIndex(row=>row.id===h.id)]=h);if(ok)$('#heat-dialog').close();else if(!externalConflict)$('#heat-dialog').close();}catch(err){$('#heat-dialog-error').textContent=err.message;}return;
 }
 if(event.target.id!=='event-form')return;event.preventDefault();const form=event.target,e=clone(eventDraft);try{e.name=form.elements.name.value.trim();e.grade=form.elements.grade.value.trim();e.note=form.elements.note.value.trim();e.scored=form.elements.scored.checked;if(!e.name)throw new Error('種目名を入力してください。');if(['race','rank'].includes(e.type)){e.points=e.points.map((p,i)=>numberValue(form.elements['point-'+i]));e.tie=form.elements.tie.value;}if(e.type==='match')for(const k of ['win','draw','loss'])e.winPoints[k]=numberValue(form.elements['win-'+k]);const isNew=e._new;delete e._new;const ok=perform(e.name+'の'+(isNew?'種目を追加':'設定を変更'),()=>{if(isNew){state.events.push(e);selectedEvent=e.id;}else state.events[state.events.findIndex(ev=>ev.id===e.id)]=e;});if(ok){$('#event-dialog').close();notify('種目の設定を保存しました。');}}catch(err){$('#dialog-error').textContent=err.message;}
});
$('#import-file').addEventListener('change',async event=>{
 const file=event.target.files[0];if(!file)return;try{if(file.size>50*1024*1024)throw new Error('読み込めるファイルは50MBまでです。');const payload=JSON.parse(await file.text());if(!payload||payload.app!=='sports-day-scoreboard'||payload.schemaVersion!==VERSION||!['backup','settings'].includes(payload.kind))throw new Error('このアプリで保存したJSONファイルを選択してください。');const incoming=validateState(payload.data);if(payload.kind==='settings'){clearResults(incoming);for(const e of incoming.events)for(const h of e.heats)for(const r of h.runners)r.teamId='';}if(!confirm((payload.kind==='settings'?'設定を読み込み、得点を未入力に戻します。':'バックアップを読み込みます。')+'現在の設定と得点が入れ替わります。よろしいですか？'))return;const ok=perform('ファイルから'+(payload.kind==='settings'?'設定':'バックアップ')+'を読み込み',()=>{state=incoming;});if(ok){view='entry';selectedEvent=state.events[0]?.id||'';render();notify('データを読み込みました。');}}catch(err){notify('読み込みに失敗しました：'+err.message,true);}
});
window.addEventListener('storage',event=>{if(event.key===STORAGE&&event.newValue){try{const data=JSON.parse(event.newValue);if(data.revision!==loadedRevision){externalConflict=true;saveError='別の画面で更新されています';renderNotices();updateSaveStatus();}}catch{}}});
window.addEventListener('afterprint',()=>{if(printPrevious!==null){view=printPrevious;printPrevious=null;render();}});
$('#help-dialog').addEventListener('close',()=>{markHelpSeen();$('#help-trigger')?.focus?.();});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&presenting){presenting=false;document.body.classList.remove('presentation');}
 const el=event.target;if(el?.dataset?.field!=='race-cell'||el.disabled||event.ctrlKey||event.metaKey||event.altKey)return;
 if(event.key==='Tab'){
  const h=getEvent(el.dataset.id)?.heats.find(h=>h.id===el.dataset.heat);if(h){const c=finishCell(h,Number(el.dataset.place)),value=c.entries.length>1?'__tie__':c.entries[0]?.teamId||'';if(el.value!==value)inputHandler(el,false);}
  const cells=$$('select[data-field="race-cell"]:not(:disabled)'),index=cells.indexOf(el),next=cells[index+(event.shiftKey?-1:1)];if(index>=0&&next){event.preventDefault();next.focus();next.scrollIntoView({block:'nearest',inline:'nearest'});}return;
 }
 if(/^[1-9]$/.test(event.key)&&!event.shiftKey){const team=state.teams[Number(event.key)-1];if(team){event.preventDefault();el.value=team.id;inputHandler(el,false);}return;}
 if(['0','Delete','Backspace'].includes(event.key)){event.preventDefault();el.value='';inputHandler(el,false);}
});
init();render();
if(shouldShowHelp())openHelp();
})();
</script>
</body>
</html>
